# cargo-audit policy (P-011). rsa via sqlx Postgres auth; not used for multisig signing.
#
# quick-xml 0.39.x (RUSTSEC-2026-0194, RUSTSEC-2026-0195): DoS advisories against XML
# parsed at runtime. quick-xml is only reachable through build-time paths — `plist`
# (Tauri macOS bundling) and `wayland-scanner` (proc-macro) — so the shipped binary
# never parses XML. Pinned by `plist ^0.39`; needs quick-xml >= 0.41 upstream in Tauri.
# Keep in sync with deny.toml.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
