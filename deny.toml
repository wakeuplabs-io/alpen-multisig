# Supply-chain policy (P-011). See https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
# No advisory ignores. Keep in sync with .cargo/audit.toml.
unmaintained = "none"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "MITNFA",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
exceptions = []

# Alpen git dependencies do not publish SPDX in Cargo.toml yet (track upstream).
[[licenses.clarify]]
crate = "strata-asm-common"
expression = "MIT OR Apache-2.0"
license-files = []

