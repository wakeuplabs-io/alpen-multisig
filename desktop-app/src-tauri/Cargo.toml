[package]
name = 'desktop-app'
version = '0.1.0'
description = 'Tauri hello world'
authors = ['you']
edition = '2021'
default-run = 'desktop-app'

[build-dependencies]
tauri-build = { version = '2', features = [] }

[dependencies]
tauri = { version = '2', features = [] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
reqwest = { version = '0.12', features = ['json'] }
tokio = { version = '1', features = ['full'] }

# Alpen crates (see docs/architecture/adrs/001-alpen-crate-dependencies.md)
# From alpenlabs/asm
strata-asm-txs-admin = { workspace = true, features = ['test-utils'] }
strata-asm-params = { workspace = true }
# From alpenlabs/strata-common
strata-crypto = { workspace = true }

# Crypto and utilities
bitcoin = { workspace = true }
ssz = { workspace = true }
secp256k1 = { workspace = true }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
async-trait = "0.1"
thiserror = "2"
trezor-client = "0.1.5"
dotenvy = "0.15"

[lib]
name = "desktop_app"
path = "src/lib.rs"

[features]
custom-protocol = ['tauri/custom-protocol']
