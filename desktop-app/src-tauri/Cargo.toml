[package]
name = 'desktop-app'
version = "0.2.1"
description = 'Alpen Multisig desktop application (Tauri + React)'
authors = ['WakeUp Labs']
license = 'MIT OR Apache-2.0'
edition = '2021'
default-run = 'desktop-app'

[features]
# Compiles the in-process ASM mock (mock:// RPC URLs) used by local dev and tests.
# MUST NOT be enabled for production/release builds — the mock bypasses on-chain
# authorization (signer set membership, enactment post-conditions).
# See src/infrastructure/asm_role_membership.rs and asm_enactment.rs.
dev-mocks = []

[build-dependencies]
tauri-build = { version = '2', features = [] }

[dependencies]
tauri = { version = '2', features = [] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
reqwest = { version = '0.12', features = ['json'] }
uuid = { version = '1', features = ['v4'] }
tokio = { version = '1', features = ['full'] }
dotenvy = "0.15"
arboard = "3"
rfd = "0.15"

# Alpen crates (see docs/architecture/adrs/001-alpen-crate-dependencies.md)
# From alpenlabs/asm
strata-asm-txs-admin = { workspace = true, features = ['test-utils'] }
strata-asm-params = { workspace = true }
strata-asm-common = { workspace = true }
strata-asm-proto-administration = { package = "strata-asm-proto-admin", git = "https://github.com/alpenlabs/asm", rev = "e0461f8f520e9be814541d1f76fb961fd847e4ae" }
strata-asm-proto-checkpoint = { git = "https://github.com/alpenlabs/asm", rev = "e0461f8f520e9be814541d1f76fb961fd847e4ae" }
strata-asm-proto-bridge-v1 = { workspace = true }
# From alpenlabs/strata-common
strata-crypto = { workspace = true }
strata-identifiers = { workspace = true }
strata-predicate = { workspace = true }
strata-l1-txfmt = { workspace = true }
strata-l1-envelope-fmt = { workspace = true }

# Crypto and utilities
bitcoin = { workspace = true }
ssz = { workspace = true }
secp256k1 = { workspace = true }
rand = "0.8"
hex = "0.4"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
trezor-client = "0.1.5"
ledger_bitcoin_client = { version = "0.6", default-features = false, features = ["async"] }
ledger-transport-hid = "0.11"
ledger-apdu = "0.11"
bip39 = "2"
bdk_wallet = { workspace = true }
bdk_electrum = { workspace = true }

[dev-dependencies]
# Wallet sync uses Electrum (bdk_electrum); Core RPC stays only as the regtest
# funding/mining harness in integration tests.
bdk_bitcoind_rpc = { workspace = true }
# Wallet fixtures (funded wallet, insert_tx/anchor/seen_at) for the Phase 5
# unconfirmed-tx list and fee-bump unit tests.
bdk_wallet = { workspace = true, features = ["test-utils"] }

[lib]
name = "desktop_app"
path = "src/lib.rs"

