name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Lint, Build, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libappindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test workspace
        run: cargo test

      - name: E2E tests
        run: cd e2e-tests && cargo test

  frontend:
    name: Frontend (Lint, Format, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: desktop-app/node_modules
          key: node-modules-${{ hashFiles('desktop-app/package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: cd desktop-app && npm ci

      - name: Prettier check
        run: cd desktop-app && npm run format:check

      - name: ESLint
        run: cd desktop-app && npm run lint

      - name: Build
        run: cd desktop-app && npm run build
