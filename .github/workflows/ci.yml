name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'orchestrator-be/**'
              - 'desktop-app/**'
              - 'e2e-tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # Root npm manifest/lockfile drive `npm ci` and the `npm audit` gate,
              # so dependency-only changes must still run the frontend job.
              - 'package.json'
              - 'package-lock.json'
              - '.github/**'

  rust:
    name: Rust (Lint, Build, Test)
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      # Default ubuntu-latest images reserve a lot of disk for unused toolchains; reclaim so
      # `cargo build` + `rust-cache` post-step (`cargo metadata`) do not hit ENOSPC.
      # Both removals run in parallel since they touch independent paths.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          wait

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          components: rustfmt, clippy

      # Caching the downloaded .deb archives turns the slowest CI step (mirror-bound apt downloads,
      # historically 4-13 min, observed as low as 244 kB/s) into a near-instant install on cache hit.
      # The key is a manual version tag, NOT a file hash: bump the `-v1` suffix only when the package
      # list below changes, so unrelated workflow edits don't evict the cache. restore-keys lets a new
      # tag warm-start from the previous cache by prefix, avoiding a fresh full download on bump.
      - name: Cache Tauri apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-tauri-${{ runner.os }}-v1
          restore-keys: apt-tauri-${{ runner.os }}-

      - name: Install Tauri system dependencies
        run: |
          set -euxo pipefail
          # World-writable so apt's unprivileged `_apt` user can write downloads here without the
          # "unsandboxed as root" warning. Ephemeral CI dir, so loose perms are fine.
          mkdir -p ~/apt-cache/partial
          chmod -R 777 ~/apt-cache
          sudo apt-get update
          # Point apt's archive cache at the restored dir: present .debs are reused, missing
          # ones are downloaded into it and picked up by the post-job cache save.
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-cache" \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libappindicator3-dev libudev-dev libusb-1.0-0-dev
          # Hand ownership back to the runner user so actions/cache can read the dir on save.
          sudo chown -R "$USER" ~/apt-cache

      # Ubuntu 24.04+ runners do not ship a `bitcoind` apt package; use a pinned release tarball
      # (aligns with `bitcoind-async-client` / corepc `29_0` features in this workspace).
      - name: Install Bitcoin Core (bitcoind) for regtest e2e
        env:
          BITCOIN_CORE_VERSION: "29.0"
        run: |
          set -euxo pipefail
          wget -q "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_CORE_VERSION}/bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          tar -xzf "bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          sudo install -m 0755 "bitcoin-${BITCOIN_CORE_VERSION}/bin/bitcoind" /usr/local/bin/bitcoind
          sudo install -m 0755 "bitcoin-${BITCOIN_CORE_VERSION}/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli
          bitcoind --version
          rm -f "bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          rm -rf "bitcoin-${BITCOIN_CORE_VERSION}"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Build workspace (shared by clippy and test)
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  frontend:
    name: Frontend (Lint, Format, Build)
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=critical

      - name: Prettier check
        run: npm run format:check --workspace desktop-app

      - name: ESLint
        run: npm run lint --workspace desktop-app

      - name: IPC schema contract tests
        run: npm run test:ipc-schemas --workspace desktop-app

      - name: Admin-wallet capability + broadcast-error contract tests
        run: |
          npm run test:admin-wallet-capability-schema --workspace desktop-app
          npm run test:derive-broadcast-error --workspace desktop-app
          npm run test:derive-proposal-actions --workspace desktop-app
          npm run test:model-format-sync-progress-label --workspace desktop-app
          npm run test:model-fee-rate --workspace desktop-app
          npm run test:model-build-receive-qr-value --workspace desktop-app
          npm run test:model-build-verify-path --workspace desktop-app
          npm run test:model-network-from-path --workspace desktop-app
          npm run test:model-admin-id-presentation --workspace desktop-app
          npm run test:model-admin-id-certificate --workspace desktop-app
          npm run test:model-verify-on-device-appearance --workspace desktop-app
          npm run test:lib-device-signing-display --workspace desktop-app
          npm run test:lib-device-copy --workspace desktop-app
          npm run test:color-tokens --workspace desktop-app
          npm run test:redundant-defcon-1 --workspace desktop-app
          npm run test:proposal-send-state --workspace desktop-app
          npm run test:proposal-title --workspace desktop-app
          npm run test:proposal-display-status --workspace desktop-app
          npm run test:action-type-from-decoded --workspace desktop-app
          npm run test:model-multisig-update-changes --workspace desktop-app
          npm run test:hooks-use-clipboard-copy --workspace desktop-app
          npm run test:model-balance-denomination --workspace desktop-app
          npm run test:model-format-admin-wallet-error --workspace desktop-app
          npm run test:model-bump-fee-rate --workspace desktop-app
          npm run test:model-compose-unconfirmed-tx-rows --workspace desktop-app
          npm run test:model-broadcast-confirm-gate --workspace desktop-app
          npm run test:model-broadcast-phase-predicates --workspace desktop-app
          npm run test:broadcast-details-card --workspace desktop-app
          npm run test:cancel-details-card --workspace desktop-app
          npm run test:approvals-list --workspace desktop-app
          npm run test:broadcast-screens-wiring --workspace desktop-app
          npm run test:cancel-copy-vendor-neutral --workspace desktop-app
          npm run test:architecture --workspace desktop-app
          npm run test:wallet-binding --workspace desktop-app
          npm run test:defcon-1-confirm-gate --workspace desktop-app
          npm run test:device-signing-message-pairing --workspace desktop-app

      - name: Wallet adapter + connect-path contract tests
        run: |
          npm run test:canonical-connect-paths --workspace desktop-app
          npm run test:get-account-xpub --workspace desktop-app
          npm run test:no-host-passphrase --workspace desktop-app
          npm run test:connect-phase-mnemonic-gate --workspace desktop-app

      - name: Build
        run: npm run build --workspace desktop-app
