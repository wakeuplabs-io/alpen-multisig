name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Lint, Build, Test)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      # Default ubuntu-latest images reserve a lot of disk for unused toolchains; reclaim so
      # `cargo build` + `rust-cache` post-step (`cargo metadata`) do not hit ENOSPC.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libappindicator3-dev

      # Ubuntu 24.04+ runners do not ship a `bitcoind` apt package; use a pinned release tarball
      # (aligns with `bitcoind-async-client` / corepc `29_0` features in this workspace).
      - name: Install Bitcoin Core (bitcoind) for regtest e2e
        env:
          BITCOIN_CORE_VERSION: "29.0"
        run: |
          set -euxo pipefail
          wget -q "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_CORE_VERSION}/bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          tar -xzf "bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          sudo install -m 0755 "bitcoin-${BITCOIN_CORE_VERSION}/bin/bitcoind" /usr/local/bin/bitcoind
          sudo install -m 0755 "bitcoin-${BITCOIN_CORE_VERSION}/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli
          bitcoind --version
          rm -f "bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          rm -rf "bitcoin-${BITCOIN_CORE_VERSION}"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Build workspace (shared by clippy and test)
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  frontend:
    name: Frontend (Lint, Format, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: desktop-app/node_modules
          key: node-modules-${{ hashFiles('desktop-app/package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: cd desktop-app && npm ci

      - name: Prettier check
        run: cd desktop-app && npm run format:check

      - name: ESLint
        run: cd desktop-app && npm run lint

      - name: Build
        run: cd desktop-app && npm run build
