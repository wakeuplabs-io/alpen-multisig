name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        # Fix every embedded build timestamp to the release commit's author date
        # so two independent builds of the same commit are bit-for-bit identical
        # (D4 / NF-2). Combined with trim-paths and the pinned toolchain.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            libssl-dev build-essential libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          # Pin via .nvmrc so the frontend bundle is built with the same Node
          # major used for reproducibility verification (D4 / NF-2).
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Record reproducibility digests
        # Tier 1 reproducibility (binary + frontend). These digests are published
        # and folded into the signed SHA256SUMS so an independent rebuild can be
        # compared without trusting the installer wrappers. See
        # docs/operations/reproducible-builds.md.
        run: |
          dist_digest="$(cd desktop-app/dist && find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          {
            echo "# Tier 1 reproducibility digests — linux (x86_64)"
            echo "binary(desktop-app)  $(sha256sum target/release/desktop-app | cut -d' ' -f1)"
            echo "frontend(dist)       ${dist_digest}"
          } > repro-digests-linux.txt
          cat repro-digests-linux.txt

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            repro-digests-linux.txt

  build-macos:
    name: Build macOS artifacts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Record reproducibility digests
        # macOS ships `shasum`, not `sha256sum`. The signed/notarized .dmg is not
        # reproducible by construction; we record the unsigned binary + frontend
        # (Tier 1) only. See docs/operations/reproducible-builds.md.
        run: |
          dist_digest="$(cd desktop-app/dist && find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          {
            echo "# Tier 1 reproducibility digests — macos (unsigned .app payload)"
            echo "binary(desktop-app)  $(shasum -a 256 target/release/desktop-app | cut -d' ' -f1)"
            echo "frontend(dist)       ${dist_digest}"
          } > repro-digests-macos.txt
          cat repro-digests-macos.txt

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            target/release/bundle/dmg/*.dmg
            repro-digests-macos.txt

  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    env:
      # Fetch git dependencies via the git CLI (more robust on the Windows
      # runner). Note: this only affects fetching into the bare db — cargo still
      # checks out the worktree with libgit2, which is why the reserved-path fix
      # below targets libgit2's config (core.protectNTFS).
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Allow Windows-reserved paths in git checkouts
        # The Alpen `asm` git dependency contains `crates/common/src/aux/`, and
        # `aux` is a reserved DOS device name. libgit2 (used by cargo to check
        # out git dependencies) rejects such paths during validation, failing
        # with "cannot checkout to invalid path ...; class=Checkout (20)".
        # `core.protectNTFS=false` disables that validation; libgit2 already
        # writes via the \\?\ extended-path namespace, so the OS accepts the
        # `aux` directory once validation passes.
        #
        # libgit2 resolves the *global* config via $HOME (then %HOMEDRIVE%%HOMEPATH%,
        # then %USERPROFILE%). A bare `git config --global` from the previous
        # attempt was not picked up by cargo's libgit2, so we write the config
        # explicitly to %USERPROFILE%\.gitconfig and pin HOME there for every
        # later step (including the cargo build).
        shell: pwsh
        run: |
          $cfg = Join-Path $env:USERPROFILE '.gitconfig'
          git config --file $cfg core.protectNTFS false
          git config --file $cfg core.longpaths true
          "HOME=$env:USERPROFILE" >> $env:GITHUB_ENV
          Write-Host "Pinned HOME for later steps: $env:USERPROFILE"
          Write-Host "--- $cfg ---"
          git config --file $cfg --list

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Pre-checkout the `asm` git dependency with the git CLI
        # cargo checks out git dependencies with libgit2, which *unconditionally*
        # rejects the reserved `aux` directory in alpenlabs/asm on Windows
        # (`cannot checkout to invalid path ...; class=Checkout (20)`) — even with
        # core.protectNTFS=false. The git CLI (git-for-windows) CAN write such
        # paths via the \\?\ namespace when protectNTFS=false + longpaths=true.
        #
        # Strategy: let cargo fetch the bare git db (expected to fail at its own
        # libgit2 checkout), then materialise the worktree ourselves with the git
        # CLI and drop cargo's `.cargo-ok` marker so the subsequent build reuses
        # it instead of re-running the failing libgit2 checkout.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # cargo fetch is expected to exit non-zero (asm checkout fails); don't abort.
          $PSNativeCommandUseErrorActionPreference = $false

          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rev = 'e0461f8f520e9be814541d1f76fb961fd847e4ae'
          $short = $rev.Substring(0, 7)

          Write-Host '== cargo fetch (expected to fail at the asm libgit2 checkout) =='
          cargo fetch
          Write-Host "cargo fetch exit: $LASTEXITCODE (non-zero is expected here)"

          $dbRoot = Join-Path $cargoHome 'git\db'
          $db = Get-ChildItem $dbRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -like 'asm-*' } | Select-Object -First 1
          if (-not $db) { throw "asm bare db not found under $dbRoot" }
          $hash = $db.Name -replace '^asm-', ''
          $dest = Join-Path $cargoHome "git\checkouts\asm-$hash\$short"
          Write-Host "db   = $($db.FullName)"
          Write-Host "dest = $dest"

          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null

          git clone --no-checkout -- "$($db.FullName)" "$dest"
          if ($LASTEXITCODE -ne 0) { throw "git clone failed ($LASTEXITCODE)" }
          git -C "$dest" -c core.protectNTFS=false -c core.longpaths=true checkout --force $rev
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed ($LASTEXITCODE)" }

          # Confirm the worktree matches HEAD, i.e. every tracked file — including
          # the reserved `aux` path — was actually written. `git diff` is used
          # (not Win32 path APIs, which also choke on `aux`) and ignores untracked
          # files, so this must run before we drop the .cargo-ok marker below.
          git -C "$dest" diff --quiet HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host '--- unexpected worktree diff vs HEAD ---'
            git -C "$dest" status --porcelain
            throw 'asm worktree does not match HEAD — aux likely not checked out'
          }

          # cargo reuses an existing checkout when HEAD matches and this marker
          # exists, skipping its own (failing) libgit2 checkout.
          '{"v":1}' | Out-File -FilePath (Join-Path $dest '.cargo-ok') -Encoding ascii -NoNewline
          Write-Host "OK: asm worktree materialised at $dest"

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts

      - name: Download macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: artifacts

      - name: Download Windows bundles
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: artifacts

      - name: Flatten artifacts
        working-directory: artifacts
        run: |
          # upload-artifact@v4 preserves the directory structure under each
          # path's common ancestor, so the Linux bundles land in deb/, rpm/,
          # appimage/ subdirs. Flatten everything to the artifacts root so the
          # manifest, signature, and release attachments use bare filenames.
          find . -mindepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          # GitHub Releases rewrites spaces in asset names to dots, which would
          # break `sha256sum -c` against a manifest built from the original
          # names. Rename here so the manifest and the published assets match.
          for f in *\ *; do
            [ -e "$f" ] && mv -- "$f" "${f// /.}"
          done
          ls -la

      - name: Assemble reproducibility digest manifest
        working-directory: artifacts
        run: |
          # Fold the per-platform Tier 1 digests (binary + frontend) into one
          # published file. Including it in SHA256SUMS below means the PGP
          # signature transitively commits to the reproducibility digests, so a
          # verifier can rebuild and compare against a signed reference (D4 / NF-2).
          {
            echo "# Reproducibility digests for this release (Tier 1: binary + frontend)."
            echo "# Independent rebuild + comparison recipe:"
            echo "#   docs/operations/reproducible-builds.md"
            echo
            cat repro-digests-linux.txt
            echo
            cat repro-digests-macos.txt
          } > REPRODUCIBLE-DIGESTS.txt
          rm -f repro-digests-linux.txt repro-digests-macos.txt
          cat REPRODUCIBLE-DIGESTS.txt

      - name: Generate SHA256SUMS manifest
        working-directory: artifacts
        run: |
          # One manifest covers every platform artifact plus the reproducibility
          # digests; integrity ships unconditionally even before a signing key is
          # configured.
          sha256sum *.deb *.rpm *.AppImage *.dmg *.msi *.exe REPRODUCIBLE-DIGESTS.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS manifest
        id: sign
        working-directory: artifacts
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          # Filename suffix identifying the signer; lets multiple employees
          # each attach SHA256SUMS.<signer>.asc (D7) without colliding.
          PGP_SIGNER_ID: ${{ vars.PGP_SIGNER_ID }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ]; then
            echo "::warning::PGP_PRIVATE_KEY secret not set — publishing checksums without a signature (D3 not yet active)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import
          signer="${PGP_SIGNER_ID:-alpen}"
          gpg_args=(--batch --yes --pinentry-mode loopback)
          if [ -n "$PGP_PASSPHRASE" ]; then
            gpg_args+=(--passphrase "$PGP_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" \
            --armor --detach-sign \
            --output "SHA256SUMS.${signer}.asc" \
            SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "asc_file=SHA256SUMS.${signer}.asc" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.exe
            artifacts/SHA256SUMS
            artifacts/REPRODUCIBLE-DIGESTS.txt
          )
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            files+=(artifacts/SHA256SUMS.*.asc)
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "${files[@]}"
