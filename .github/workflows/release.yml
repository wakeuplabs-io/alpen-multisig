name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-release-checks:
    name: Pre-release security & license checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cargo audit (vulnerability scan)
        run: cargo audit

      - name: Cargo deny (license & source check)
        run: cargo deny check

  build-linux:
    name: Build Linux artifacts
    needs: [pre-release-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        # Fix every embedded build timestamp to the release commit's author date
        # so two independent builds of the same commit are bit-for-bit identical
        # (D4 / NF-2). Combined with trim-paths and the pinned toolchain.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            libssl-dev build-essential libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          # Pin via .nvmrc so the frontend bundle is built with the same Node
          # major used for reproducibility verification (D4 / NF-2).
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Record reproducibility digests
        # Tier 1 reproducibility (binary + frontend). These digests are published
        # and folded into the signed SHA256SUMS so an independent rebuild can be
        # compared without trusting the installer wrappers. See
        # docs/external/reproducible-builds.md.
        run: |
          dist_digest="$(cd desktop-app/dist && find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          {
            echo "# Tier 1 reproducibility digests — linux (x86_64)"
            echo "binary(desktop-app)  $(sha256sum target/release/desktop-app | cut -d' ' -f1)"
            echo "frontend(dist)       ${dist_digest}"
          } > repro-digests-linux.txt
          cat repro-digests-linux.txt

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            repro-digests-linux.txt

  build-macos:
    name: Build macOS artifacts
    needs: [pre-release-checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Ad-hoc re-sign app bundle (no Apple Developer ID configured)
        # On Apple Silicon, rustc/ld embeds a linker ad-hoc signature
        # (flags=adhoc,linker-signed) into the executable before Tauri ever
        # assembles the .app. Tauri skips signing the bundle entirely when no
        # signingIdentity is configured (see tauri-bundler macos/app.rs
        # `keychain()` returning None), so Contents/_CodeSignature is never
        # created. The result fails `codesign --verify --deep --strict` with
        # "code has no resources but signature indicates they must be present"
        # and Gatekeeper reports the app as damaged. Re-signing ad-hoc after
        # the build seals Contents/Resources properly, then the .dmg is
        # rebuilt from the corrected .app. Once Alpen provisions an Apple
        # Developer ID (see docs/operations/platform-code-signing-requirements.md),
        # this step should be replaced with proper signing/notarization.
        run: |
          APP_PATH="target/release/bundle/macos/Alpen Multisig.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          # Derive version from the git tag (v0.2.0 → 0.2.0); fall back to
          # 0.0.0-dev for workflow_dispatch runs that carry no tag.
          TAG="${GITHUB_REF_NAME:-}"
          APP_VERSION="${TAG#v}"
          APP_VERSION="${APP_VERSION:-0.0.0-dev}"

          rm -f target/release/bundle/dmg/*.dmg
          bash target/release/bundle/dmg/bundle_dmg.sh \
            --volname "Alpen Multisig" \
            --icon-size 80 \
            --app-drop-link 180 170 \
            "target/release/bundle/dmg/Alpen Multisig_${APP_VERSION}_aarch64.dmg" \
            "target/release/bundle/macos/"

      - name: Record reproducibility digests
        # macOS ships `shasum`, not `sha256sum`. The signed/notarized .dmg is not
        # reproducible by construction; we record the unsigned binary + frontend
        # (Tier 1) only. See docs/external/reproducible-builds.md.
        run: |
          dist_digest="$(cd desktop-app/dist && find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          {
            echo "# Tier 1 reproducibility digests — macos (unsigned .app payload)"
            echo "binary(desktop-app)  $(shasum -a 256 target/release/desktop-app | cut -d' ' -f1)"
            echo "frontend(dist)       ${dist_digest}"
          } > repro-digests-macos.txt
          cat repro-digests-macos.txt

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            target/release/bundle/dmg/*.dmg
            repro-digests-macos.txt

  build-windows:
    # Cross-compiled on Linux instead of a native windows-latest runner: the
    # native build is blocked by upstream Windows incompatibilities in the Alpen
    # dependencies (reserved `aux` dir + a path-separator bug in ssz-gen's
    # codegen). Building on Linux sidesteps all of them — the checkout uses a
    # Linux filesystem and the codegen runs with `/` separators. The trade-off is
    # NSIS `.exe` only (WiX `.msi` is Windows-only). Full analysis:
    # docs/operations/windows-build-incompatibilities.md
    name: Build Windows artifacts (cross-compiled on Linux)
    needs: [pre-release-checks]
    runs-on: ubuntu-latest
    env:
      # cargo-xwin downloads the Windows SDK + CRT; accept Microsoft's license.
      XWIN_ACCEPT_LICENSE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Install cross-compile toolchain and NSIS
        # clang/lld/llvm back cargo-xwin's clang-cl + lld-link; nsis is what Tauri
        # shells out to for the Windows installer.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nsis

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows-xwin

      - name: Cache xwin (Windows SDK/CRT)
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-cache

      - name: Install cargo-xwin
        run: cargo install --locked cargo-xwin

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (cross-compile to Windows)
        working-directory: desktop-app
        # --no-bundle: Tauri's bundler validates --bundles against the *host* OS,
        # so it cannot produce an NSIS/MSI installer from Linux (only deb/rpm/
        # appimage are offered). We cross-compile the raw .exe here; producing a
        # Windows installer from Linux is a separate problem tracked in
        # docs/operations/windows-build-incompatibilities.md.
        run: npm run tauri -- build --runner cargo-xwin --target x86_64-pc-windows-msvc --no-bundle

      - name: Stage Windows executable with a descriptive name
        # Tauri emits a bare `desktop-app.exe`; give the published asset a name
        # that identifies the platform/arch (no installer yet — see follow-up in
        # docs/operations/windows-build-incompatibilities.md).
        run: |
          mkdir -p dist-windows
          cp target/x86_64-pc-windows-msvc/release/desktop-app.exe \
            dist-windows/desktop-app-x86_64-windows.exe

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            dist-windows/*.exe

  release:
    name: Publish GitHub release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts

      - name: Download macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: artifacts

      - name: Download Windows bundles
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: artifacts

      - name: Flatten artifacts
        working-directory: artifacts
        run: |
          # upload-artifact@v4 preserves the directory structure under each
          # path's common ancestor, so the Linux bundles land in deb/, rpm/,
          # appimage/ subdirs. Flatten everything to the artifacts root so the
          # manifest, signature, and release attachments use bare filenames.
          find . -mindepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          # GitHub Releases rewrites spaces in asset names to dots, which would
          # break `sha256sum -c` against a manifest built from the original
          # names. Rename here so the manifest and the published assets match.
          for f in *\ *; do
            [ -e "$f" ] && mv -- "$f" "${f// /.}"
          done
          ls -la

      - name: Assemble reproducibility digest manifest
        working-directory: artifacts
        run: |
          # Fold the per-platform Tier 1 digests (binary + frontend) into one
          # published file. Including it in SHA256SUMS below means the PGP
          # signature transitively commits to the reproducibility digests, so a
          # verifier can rebuild and compare against a signed reference (D4 / NF-2).
          {
            echo "# Reproducibility digests for this release (Tier 1: binary + frontend)."
            echo "# Independent rebuild + comparison recipe:"
            echo "#   docs/external/reproducible-builds.md"
            echo
            cat repro-digests-linux.txt
            echo
            cat repro-digests-macos.txt
          } > REPRODUCIBLE-DIGESTS.txt
          rm -f repro-digests-linux.txt repro-digests-macos.txt
          cat REPRODUCIBLE-DIGESTS.txt

      - name: Generate SHA256SUMS manifest
        working-directory: artifacts
        run: |
          # One manifest covers every platform artifact plus the reproducibility
          # digests; integrity ships unconditionally even before a signing key is
          # configured.
          # Windows ships the NSIS .exe only (no .msi: WiX is Windows-only and the
          # artifact is cross-compiled on Linux). See windows-build-incompatibilities.md.
          sha256sum *.deb *.rpm *.AppImage *.dmg *.exe REPRODUCIBLE-DIGESTS.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS manifest
        id: sign
        working-directory: artifacts
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          # Filename suffix identifying the signer; lets multiple employees
          # each attach SHA256SUMS.<signer>.asc (D7) without colliding.
          PGP_SIGNER_ID: ${{ vars.PGP_SIGNER_ID }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ]; then
            echo "::warning::PGP_PRIVATE_KEY secret not set — publishing checksums without a signature (D3 not yet active)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import
          signer="${PGP_SIGNER_ID:-alpen}"
          gpg_args=(--batch --yes --pinentry-mode loopback)
          if [ -n "$PGP_PASSPHRASE" ]; then
            gpg_args+=(--passphrase "$PGP_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" \
            --armor --detach-sign \
            --output "SHA256SUMS.${signer}.asc" \
            SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "asc_file=SHA256SUMS.${signer}.asc" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/SHA256SUMS
            artifacts/REPRODUCIBLE-DIGESTS.txt
          )
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            files+=(artifacts/SHA256SUMS.*.asc)
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "${files[@]}"
