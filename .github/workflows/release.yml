name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        # Fix every embedded build timestamp to the release commit's author date
        # so two independent builds of the same commit are bit-for-bit identical
        # (D4 / NF-2). Combined with trim-paths and the pinned toolchain.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libappindicator3-dev \
            libssl-dev build-essential libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          # Pin via .nvmrc so the frontend bundle is built with the same Node
          # major used for reproducibility verification (D4 / NF-2).
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Record reproducibility digests
        # Tier 1 reproducibility (binary + frontend). These digests are published
        # and folded into the signed SHA256SUMS so an independent rebuild can be
        # compared without trusting the installer wrappers. See
        # docs/operations/reproducible-builds.md.
        run: |
          dist_digest="$(cd desktop-app/dist && find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          {
            echo "# Tier 1 reproducibility digests — linux (x86_64)"
            echo "binary(desktop-app)  $(sha256sum target/release/desktop-app | cut -d' ' -f1)"
            echo "frontend(dist)       ${dist_digest}"
          } > repro-digests-linux.txt
          cat repro-digests-linux.txt

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            repro-digests-linux.txt

  build-macos:
    name: Build macOS artifacts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Record reproducibility digests
        # macOS ships `shasum`, not `sha256sum`. The signed/notarized .dmg is not
        # reproducible by construction; we record the unsigned binary + frontend
        # (Tier 1) only. See docs/operations/reproducible-builds.md.
        run: |
          dist_digest="$(cd desktop-app/dist && find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          {
            echo "# Tier 1 reproducibility digests — macos (unsigned .app payload)"
            echo "binary(desktop-app)  $(shasum -a 256 target/release/desktop-app | cut -d' ' -f1)"
            echo "frontend(dist)       ${dist_digest}"
          } > repro-digests-macos.txt
          cat repro-digests-macos.txt

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            target/release/bundle/dmg/*.dmg
            repro-digests-macos.txt

  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    env:
      # Use the git CLI (configured below) for cargo fetches so the Windows
      # reserved-name handling applies during dependency resolution.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Allow Windows-reserved paths in git checkouts
        # The Alpen `asm` git dependency contains a path under a directory named
        # `aux`, a reserved device name on Windows. git/libgit2 (used by cargo)
        # refuse to check such paths out by default (NTFS protection), failing
        # the fetch with "cannot checkout to invalid path ...; class=Checkout".
        # Disabling protectNTFS and enabling longpaths makes git use the \\?\
        # extended-path prefix, which bypasses Win32 reserved-name parsing.
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop-app/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop-app
        run: npm run tauri build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts

      - name: Download macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: artifacts

      - name: Download Windows bundles
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: artifacts

      - name: Flatten artifacts
        working-directory: artifacts
        run: |
          # upload-artifact@v4 preserves the directory structure under each
          # path's common ancestor, so the Linux bundles land in deb/, rpm/,
          # appimage/ subdirs. Flatten everything to the artifacts root so the
          # manifest, signature, and release attachments use bare filenames.
          find . -mindepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          # GitHub Releases rewrites spaces in asset names to dots, which would
          # break `sha256sum -c` against a manifest built from the original
          # names. Rename here so the manifest and the published assets match.
          for f in *\ *; do
            [ -e "$f" ] && mv -- "$f" "${f// /.}"
          done
          ls -la

      - name: Assemble reproducibility digest manifest
        working-directory: artifacts
        run: |
          # Fold the per-platform Tier 1 digests (binary + frontend) into one
          # published file. Including it in SHA256SUMS below means the PGP
          # signature transitively commits to the reproducibility digests, so a
          # verifier can rebuild and compare against a signed reference (D4 / NF-2).
          {
            echo "# Reproducibility digests for this release (Tier 1: binary + frontend)."
            echo "# Independent rebuild + comparison recipe:"
            echo "#   docs/operations/reproducible-builds.md"
            echo
            cat repro-digests-linux.txt
            echo
            cat repro-digests-macos.txt
          } > REPRODUCIBLE-DIGESTS.txt
          rm -f repro-digests-linux.txt repro-digests-macos.txt
          cat REPRODUCIBLE-DIGESTS.txt

      - name: Generate SHA256SUMS manifest
        working-directory: artifacts
        run: |
          # One manifest covers every platform artifact plus the reproducibility
          # digests; integrity ships unconditionally even before a signing key is
          # configured.
          sha256sum *.deb *.rpm *.AppImage *.dmg *.msi *.exe REPRODUCIBLE-DIGESTS.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS manifest
        id: sign
        working-directory: artifacts
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          # Filename suffix identifying the signer; lets multiple employees
          # each attach SHA256SUMS.<signer>.asc (D7) without colliding.
          PGP_SIGNER_ID: ${{ vars.PGP_SIGNER_ID }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ]; then
            echo "::warning::PGP_PRIVATE_KEY secret not set — publishing checksums without a signature (D3 not yet active)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import
          signer="${PGP_SIGNER_ID:-alpen}"
          gpg_args=(--batch --yes --pinentry-mode loopback)
          if [ -n "$PGP_PASSPHRASE" ]; then
            gpg_args+=(--passphrase "$PGP_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" \
            --armor --detach-sign \
            --output "SHA256SUMS.${signer}.asc" \
            SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "asc_file=SHA256SUMS.${signer}.asc" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.exe
            artifacts/SHA256SUMS
            artifacts/REPRODUCIBLE-DIGESTS.txt
          )
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            files+=(artifacts/SHA256SUMS.*.asc)
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "${files[@]}"
