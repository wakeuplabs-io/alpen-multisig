name: E2E WebDriver

# Manual-only workflow. Intended for occasional, on-demand end-to-end checks
# (e.g. after a release) — NOT on push/PR, since a full run takes ~40-55 min and
# spins up the whole Docker stack + a real Tauri binary driven via WebDriver.
# Trigger from the Actions tab → "E2E WebDriver" → "Run workflow".
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Run WebDriver e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # local-stack.sh requires the asm/ submodule populated to build the asm image.
          submodules: recursive

      # Default ubuntu-latest images reserve a lot of disk for unused toolchains; reclaim so
      # the Docker image builds + Tauri build do not hit ENOSPC.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          wait

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Cache the downloaded .deb archives (slow, mirror-bound). Bump -v1 only when the
      # package list below changes. webkit2gtk-driver provides WebKitWebDriver; xvfb gives a
      # virtual display for the headless GUI; the rest are the Tauri build/runtime deps.
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-e2e-${{ runner.os }}-v1
          restore-keys: apt-e2e-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          mkdir -p ~/apt-cache/partial
          chmod -R 777 ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-cache" \
            webkit2gtk-driver xvfb jq curl \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libappindicator3-dev libudev-dev libusb-1.0-0-dev
          sudo chown -R "$USER" ~/apt-cache

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run e2e suite
        run: |
          set -euxo pipefail
          # Virtual display for the Tauri/WebKit GUI (headless runner has no X server).
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          # run-e2e.sh auto-detects ~/.cargo/bin/tauri-driver, but be explicit.
          export TAURI_DRIVER_PATH="$HOME/.cargo/bin/tauri-driver"
          # The script generates the .env files and brings up the Docker stack itself.
          ./scripts/run-e2e.sh

      # Containers are kept up (no --stop-after) so logs are available here. The runner VM is
      # ephemeral and destroyed after the job, so there is nothing to clean up.
      - name: Collect Docker stack logs
        if: always()
        run: |
          docker compose -f staging/docker-compose.local.yml logs --no-color > /tmp/docker-stack.log 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/docker-stack.log
            /tmp/xvfb.log
          if-no-files-found: ignore
          retention-days: 7
