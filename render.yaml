services:
  # ── 1. Bitcoin regtest ────────────────────────────────────────────────────
  - type: web
    name: alpen-multisig-bitcoin
    env: docker
    dockerfilePath: ./staging/Dockerfile.bitcoin
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "18443"

  # ── 2. Strata ASM runner ──────────────────────────────────────────────────
  - type: web
    name: alpen-multisig-asm
    env: docker
    dockerfilePath: ./staging/Dockerfile.asm
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: BITCOIN_RPC_URL
        value: "http://alpen-multisig-bitcoin:18443"
      - key: BITCOIN_RPC_USER
        value: "user"
      - key: BITCOIN_RPC_PASS
        value: "password"

  # ── 3. Orchestrator ───────────────────────────────────────────────────────
  - type: web
    name: alpen-multisig-orchestrator
    env: docker
    dockerfilePath: ./staging/Dockerfile.orchestrator
    dockerContext: .
    plan: free
    envVars:
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: SERVER_PORT
        value: "3000"
      - key: STRATA_ADMIN_STATE_RPC_URL
        value: "http://alpen-multisig-asm:8080"
      - key: BITCOIN_RPC_URL
        value: "http://alpen-multisig-bitcoin:18443"
      - key: BITCOIN_RPC_USER
        value: "user"
      - key: BITCOIN_RPC_PASS
        value: "password"
      - key: BITCOIN_WALLET_NAME
        value: "staging"
      - key: DEV_MINE_ENABLED
        value: "1"
