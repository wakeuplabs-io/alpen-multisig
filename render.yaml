services:
  # ── 1. Bitcoin regtest ────────────────────────────────────────────────────
  - type: web
    name: alpen-multisig-bitcoin
    env: docker
    dockerfilePath: ./staging/Dockerfile.bitcoin
    dockerContext: .
    plan: standard
    disk:
      name: bitcoin-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "18443"

  # ── 2. Strata ASM runner ──────────────────────────────────────────────────
  - type: web
    name: alpen-multisig-asm
    env: docker
    dockerfilePath: ./staging/Dockerfile.asm
    dockerContext: .
    plan: standard
    disk:
      name: asm-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8080"
      - key: BITCOIN_RPC_URL
        value: "http://alpen-multisig-bitcoin:18443"
      - key: BITCOIN_RPC_USER
        value: "user"
      - key: BITCOIN_RPC_PASS
        value: "password"

  # ── 3. Orchestrator ───────────────────────────────────────────────────────
  - type: web
    name: alpen-multisig-orchestrator
    env: docker
    dockerfilePath: ./staging/Dockerfile.orchestrator
    dockerContext: .
    plan: standard
    envVars:
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: SERVER_PORT
        value: "3000"
      - key: STRATA_ADMIN_STATE_RPC_URL
        value: "http://alpen-multisig-asm:8080"
      - key: BITCOIN_RPC_URL
        value: "http://alpen-multisig-bitcoin:18443"
      - key: BITCOIN_RPC_USER
        value: "user"
      - key: BITCOIN_RPC_PASS
        value: "password"
      - key: BITCOIN_WALLET_NAME
        value: "staging"
      - key: DEV_MINE_ENABLED
        value: "1"
      - key: ALLOW_DEV_MNEMONIC_SIGNING
        value: "1"
      - key: ALLOW_DEV_OPERATOR_KEY
        value: "1"

  # ── Cron: auto-mine 2 blocks every minute ────────────────────────────────
  - type: cron
    name: alpen-multisig-staging-automine
    env: docker
    dockerfilePath: ./staging/Dockerfile.cron
    dockerContext: .
    schedule: "* * * * *"
    startCommand: >-
      curl -sf -X POST
      "https://alpen-multisig-orchestrator.onrender.com/api/v1/dev/mine?count=2"
      || true
