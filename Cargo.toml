[workspace]
members = ['orchestator-be', 'desktop-app/src-tauri', 'e2e-tests']
resolver = '2'

# Vendored `trezor-client` 0.1.5: SLIP-0132 xpub normalization (see vendor README if present) and
# sign_tx fixes for modern Trezor firmware (`script_pubkey` on TxAck inputs, P2TR → SPENDTAPROOT).
[workspace.dependencies]
# Alpen crates — see docs/architecture/adrs/001-alpen-crate-dependencies.md
# From alpenlabs/asm (rev-pinned — main HEAD == tag v0.1-alpha.5; no stable tag adopted yet)
strata-asm-txs-admin = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-asm-params = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-asm-common = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-asm-txs-test-utils = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }

# From alpenlabs/strata-common (tag-pinned)
strata-crypto = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }
strata-l1-txfmt = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }

# From alpenlabs/alpen (rev-pinned) — to be removed once unused (see follow-up commit)
strata-primitives = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-test-utils = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }

# SSZ serialization (replaces Borsh for admin tx wire format after upstream PR alpenlabs/asm#8)
ssz = { git = "https://github.com/alpenlabs/ssz-gen", tag = "v0.15.0" }

# Third-party (versions matched to Alpen workspace to avoid type duplication)
bitcoin = { version = "0.32.6", features = ["serde"] }
borsh = { version = "1.5.0", features = ["derive"] }
secp256k1 = { version = "0.29.1", features = ["global-context", "std"] }
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Shared across workspace members
serde = { version = "1", features = ["derive"] }
serde_json = "1"
