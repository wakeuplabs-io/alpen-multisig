[workspace]
members = ['orchestator-be', 'desktop-app/src-tauri']
exclude = ['e2e-tests']
resolver = '2'

[workspace.dependencies]
# Alpen crates — see docs/architecture/adrs/001-alpen-crate-dependencies.md
# From alpenlabs/alpen (rev-pinned, no suitable tag available yet)
strata-asm-txs-admin = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-crypto = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-asm-params = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-primitives = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-asm-common = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }

# From alpenlabs/strata-common (tag-pinned)
strata-l1-txfmt = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc11" }

# Third-party (versions matched to Alpen workspace to avoid type duplication)
bitcoin = { version = "0.32.6", features = ["serde"] }
borsh = { version = "1.5.0", features = ["derive"] }
secp256k1 = { version = "0.29.1", features = ["global-context", "std"] }

# Shared across workspace members
serde = { version = "1", features = ["derive"] }
serde_json = "1"
