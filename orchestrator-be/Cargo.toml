[package]
name = "orchestrator-be"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id"] }
dotenvy = "0.15"
bitcoin = { workspace = true }
rand = { workspace = true }
hex = "0.4"
sha2 = "0.10"
reqwest = { workspace = true }
ssz = { workspace = true }
strata-asm-common = { workspace = true }
strata-asm-params = { workspace = true }
strata-asm-proto-administration = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
