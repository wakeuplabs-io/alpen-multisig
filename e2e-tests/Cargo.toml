[package]
name = "alpen-multisig-e2e-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# From alpenlabs/asm
strata-asm-manifest-types = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-asm-spec = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-asm-txs-admin = { workspace = true, features = ["test-utils"] }
strata-asm-params = { workspace = true, features = ["arbitrary"] }
strata-asm-common.workspace = true
strata-asm-worker = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-btc-verification = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-test-utils-arb = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-test-utils-btcio = { git = "https://github.com/alpenlabs/asm", rev = "a8559d3" }
strata-asm-txs-test-utils.workspace = true

# From alpenlabs/strata-common
strata-btc-types = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }
strata-crypto = { workspace = true, features = ["test-utils"] }
strata-identifiers = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }
strata-l1-envelope-fmt = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }
strata-l1-txfmt.workspace = true
strata-merkle = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }
strata-tasks = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc16" }

# Desktop app (application layer)
desktop-app = { path = "../desktop-app/src-tauri" }

# Third-party
anyhow = "1"
bitcoin.workspace = true
bitcoind-async-client = { version = "0.10.1", features = ["29_0"] }
corepc-node = { version = "0.10.0", features = ["29_0"] }
secp256k1 = { workspace = true, features = ["recovery"] }
rand.workspace = true
hex.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
