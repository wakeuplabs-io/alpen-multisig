[package]
name = "alpen-multisig-e2e-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# From alpenlabs/asm
strata-asm-manifest-types = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-asm-spec = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-asm-txs-admin = { workspace = true, features = ["test-utils"] }
strata-asm-params = { workspace = true, features = ["arbitrary"] }
strata-asm-common.workspace = true
strata-asm-proto-admin = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-asm-proto-checkpoint = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-asm-proto-bridge.workspace = true
strata-asm-bridge-types.workspace = true
strata-asm-admin-threshold-sig.workspace = true
strata-asm-admin-types.workspace = true
strata-predicate = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }
strata-asm-worker = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1", features = ["test-utils"] }
strata-btc-verification = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-test-utils-arb = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-test-utils-btcio = { git = "https://github.com/alpenlabs/asm", rev = "7ada090580ac12af9cd411254415090725efcec1" }
strata-asm-txs-test-utils.workspace = true

# From alpenlabs/strata-common
strata-btc-types = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }
strata-crypto = { workspace = true, features = ["test-utils"] }
strata-identifiers = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }
strata-l1-envelope-fmt = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }
strata-l1-txfmt.workspace = true
strata-merkle = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }
strata-tasks = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }

# Desktop app (application layer)
desktop-app = { path = "../desktop-app/src-tauri" }

# Third-party
anyhow = "1"
bitcoin.workspace = true
bitcoind-async-client = { version = "0.10.8", default-features = false, features = ["30_2"] }
corepc-node = { version = "0.12.0", features = ["30_2"] }
secp256k1 = { workspace = true, features = ["recovery"] }
rand.workspace = true
hex.workspace = true
ssz.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
