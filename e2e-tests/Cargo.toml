[package]
name = "alpen-multisig-e2e-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# From alpenlabs/alpen
strata-asm-txs-admin = { git = "https://github.com/alpenlabs/alpen", rev = "308211f", features = ["test-utils"] }
strata-crypto = { git = "https://github.com/alpenlabs/alpen", rev = "308211f", features = ["test-utils"] }
strata-asm-params = { git = "https://github.com/alpenlabs/alpen", rev = "308211f", features = ["arbitrary"] }
strata-primitives = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-asm-common = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-asm-txs-test-utils = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }
strata-test-utils = { git = "https://github.com/alpenlabs/alpen", rev = "308211f" }

# From alpenlabs/strata-common
strata-l1-txfmt = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.1.0-alpha-rc11" }

# Desktop app (application layer)
desktop-app = { path = "../desktop-app/src-tauri" }

# Third-party (versions matched to alpen workspace)
bitcoin = { version = "0.32.6", features = ["serde"] }
borsh = { version = "1.5.0", features = ["derive"] }
secp256k1 = { version = "0.29.1", features = ["global-context", "std", "recovery"] }
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
