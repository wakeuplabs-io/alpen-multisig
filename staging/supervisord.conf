[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:bitcoind]
command=bitcoind
    -regtest
    -datadir=/data/bitcoin
    -server=1
    -txindex=1
    -rpcbind=127.0.0.1
    -rpcallowip=127.0.0.1
    -rpcuser=user
    -rpcpassword=password
    -rpcport=18443
    -zmqpubrawblock=tcp://127.0.0.1:28332
    -fallbackfee=0.0002
    -wallet=staging
    -daemon=0
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:asm-runner]
command=/usr/local/bin/strata-asm-runner
    --config /app/asm-config.toml
    --params /data/asm-params.json
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:orchestrator]
command=/usr/local/bin/orchestrator
autostart=true
autorestart=true
startretries=5
startsecs=3
environment=
    SERVER_HOST="0.0.0.0",
    SERVER_PORT="3000",
    STRATA_ADMIN_STATE_RPC_URL="http://127.0.0.1:8080",
    BITCOIN_RPC_URL="http://127.0.0.1:18443",
    BITCOIN_RPC_USER="user",
    BITCOIN_RPC_PASS="password",
    BITCOIN_WALLET_NAME="staging",
    DEV_MINE_ENABLED="1",
    ALLOW_DEV_MNEMONIC_SIGNING="1",
    ALLOW_DEV_OPERATOR_KEY="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
