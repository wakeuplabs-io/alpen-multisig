services:
  bitcoin:
    build:
      context: ..
      dockerfile: staging/Dockerfile.bitcoin
    ports:
      - "18443:18443"
    volumes:
      - bitcoin-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-datadir=/data/bitcoin",
             "-rpcconnect=127.0.0.1", "-rpcport=18443",
             "-rpcuser=user", "-rpcpassword=password", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  asm:
    build:
      context: ..
      dockerfile: staging/Dockerfile.asm
    ports:
      - "8080:8080"
    volumes:
      - asm-data:/data
    environment:
      BITCOIN_RPC_URL: http://bitcoin:18443
      BITCOIN_RPC_USER: user
      BITCOIN_RPC_PASS: password
    depends_on:
      bitcoin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  orchestrator:
    build:
      context: ..
      dockerfile: staging/Dockerfile.orchestrator
    ports:
      - "3000:3000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      BITCOIN_RPC_URL: http://bitcoin:18443
      BITCOIN_RPC_USER: user
      BITCOIN_RPC_PASS: password
      BITCOIN_WALLET_NAME: staging
      STRATA_ADMIN_STATE_RPC_URL: http://asm:8080
      DATABASE_URL: "postgresql://neondb_owner:npg_HuMb6SVQxW7s@ep-proud-star-aqpu1w7v-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      DEV_MINE_ENABLED: "1"
      ALLOW_DEV_MNEMONIC_SIGNING: "1"
    depends_on:
      bitcoin:
        condition: service_healthy
      asm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bitcoin-data:
  asm-data:
