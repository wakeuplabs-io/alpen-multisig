services:
  bitcoin:
    build:
      context: ..
      dockerfile: staging/Dockerfile.bitcoin
    ports:
      - "18443:18443"
    volumes:
      - bitcoin-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-datadir=/data/bitcoin",
             "-rpcconnect=127.0.0.1", "-rpcport=18443",
             "-rpcuser=user", "-rpcpassword=password", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  asm:
    build:
      context: ..
      dockerfile: staging/Dockerfile.asm
    ports:
      - "8080:8080"
    volumes:
      - asm-data:/data
    environment:
      BITCOIN_RPC_URL: http://bitcoin:18443
      BITCOIN_RPC_USER: user
      BITCOIN_RPC_PASS: password
    depends_on:
      bitcoin:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: ..
      dockerfile: staging/Dockerfile.orchestrator
    ports:
      - "3000:3000"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      BITCOIN_RPC_URL: http://bitcoin:18443
      BITCOIN_RPC_USER: user
      BITCOIN_RPC_PASS: password
      BITCOIN_WALLET_NAME: staging
      STRATA_ADMIN_STATE_RPC_URL: http://asm:8080
      DEV_MINE_ENABLED: "1"
      ALLOW_DEV_MNEMONIC_SIGNING: "1"
      ALLOW_DEV_OPERATOR_KEY: "1"
    depends_on:
      bitcoin:
        condition: service_healthy
      asm:
        condition: service_started
    restart: unless-stopped

volumes:
  bitcoin-data:
  asm-data:
