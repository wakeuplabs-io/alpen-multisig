services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    # Internal network only — not exposed to host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  bitcoin:
    build:
      context: ..
      dockerfile: staging/Dockerfile.bitcoin
    ports:
      - "18443:18443"
    volumes:
      - bitcoin-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-datadir=/data/bitcoin",
             "-rpcconnect=127.0.0.1", "-rpcport=18443",
             "-rpcuser=user", "-rpcpassword=password", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  asm:
    build:
      context: ..
      dockerfile: staging/Dockerfile.asm
    ports:
      - "8080:8080"
    volumes:
      - asm-data:/data
    env_file:
      - asm.env
    depends_on:
      bitcoin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"method\":\"strata_asm_getStatus\",\"id\":1}",
             "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  orchestrator:
    build:
      context: ..
      dockerfile: staging/Dockerfile.orchestrator
    ports:
      - "3000:3000"
    env_file:
      - orchestrator.env
    depends_on:
      postgres:
        condition: service_healthy
      bitcoin:
        condition: service_healthy
      asm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  regtest-dev-api:
    build:
      context: ..
      dockerfile: staging/Dockerfile.regtest-dev-api
    ports:
      - "3001:3001"
    env_file:
      - regtest-dev-api.env
    depends_on:
      bitcoin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:3001/mine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bitcoin-data:
  asm-data: